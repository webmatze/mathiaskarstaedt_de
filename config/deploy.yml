# Deploys to the Hetzner server that already runs elbcasts.dev, pagebee.io and
# headlessbee.com. They share one kamal-proxy, which terminates TLS and routes
# by host, so this app only has to claim its own hostnames.
service: mathiaskarstaedt
image: webmatze/mathiaskarstaedt

servers:
  web:
    hosts:
      # Tailscale address of the Hetzner server (public: 46.224.108.246)
      - 100.106.129.53

proxy:
  ssl: true
  hosts:
    - mathiaskarstaedt.de
    - www.mathiaskarstaedt.de
  app_port: 80 # Thruster
  healthcheck:
    path: /up
    interval: 10
    timeout: 5

registry:
  server: ghcr.io
  username: webmatze
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Solid Queue runs inside Puma, so the nightly GitHub sync needs no second container.
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  # The SQLite databases (app, queue, cache, cable) and the Active Storage
  # uploads both live here — this volume is the whole backup surface.
  - "mathiaskarstaedt_storage:/rails/storage"

# Bridge fingerprinted assets between versions so in-flight requests do not 404.
asset_path: /rails/public/assets

builder:
  arch: amd64
  # Build on the server itself: the Mac is arm64, and cross-building a Rails
  # image with native gems under emulation is slow.
  remote: ssh://root@100.106.129.53
